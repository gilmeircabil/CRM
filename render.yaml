services:
  - type: web
    name: clientflow-crm-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm run start
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_EMAIL
        value: admin@clientflow.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SAME_SITE
        value: none
